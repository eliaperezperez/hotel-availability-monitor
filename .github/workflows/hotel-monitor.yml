name: Hotel availability monitor

on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send a test notification issue'
        type: boolean
        default: false
  schedule:
    # Every hour, offset from the top of the hour to reduce GitHub Actions queueing.
    - cron: '23 * * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: hotel-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check hotel availability
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: python monitor.py

      - name: Persist state
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "hotel-monitor[bot]"
          git config user.email "hotel-monitor[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update hotel monitor state"
          git pull --rebase
          git push
